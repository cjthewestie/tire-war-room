# DGX Spark production stack: vLLM (Nemotron 3.5 Lightning 30B-A3B NVFP4) + Qdrant + war-room app.
# One box, all inside the factory, no outbound traffic (pages 9-10).
#
#   cd /opt/warroom/current/deploy/spark
#   cp .env.example .env                       # once
#   ../bin/fetch_models.sh                     # once, while still online: weights into ${HF_CACHE}
#   docker compose up -d                       # systemd unit warroom-stack.service does this at boot
#   docker compose --profile control up -d vllm-fp8      # page-10 control group on :8002 (stop vllm first)
#
# Model id verified on Hugging Face 2026-10-03: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
# (+ ...-NVFP4-DSpark draft, ...-BF16 reference). Flags and sources: deploy/spark/vllm-serve.sh.
#
# Networks: vLLM, Qdrant and MQTT sit on `core` (internal, no route out of the host) plus `edge`, a normal
# bridge needed only because Docker cannot publish ports from an internal network; all three publish on
# 127.0.0.1 only. The app runs with `network_mode: host` and reaches them on those loopback ports.
# Why host networking for the app: the write guard (warroom/api/app.py) treats loopback as the on-box
# touchscreen seat and makes every LAN client (the supervisor phone) send WARROOM_SUPERVISOR_PIN. Docker's
# port publishing rewrites the client source address (Linux: the edge bridge gateway 172.x.0.1, Docker
# Desktop: 192.168.65.1), so behind `ports:` nothing is loopback, the touchscreen got 403 on every
# approval, and trusting the bridge gateway instead would also trust everything docker-proxy forwards.
# On the host network the app sees the real address: 127.0.0.1 = touchscreen, LAN IP = phone + PIN.
# Egress is enforced on the host by deploy/network/nftables-warroom.nft (output hook covers the host-
# networked app, forward hook the bridged containers), and every image runs with HF / telemetry offline
# switches so nothing even tries. INBOUND to the two ports meant for the LAN is filtered by
# deploy/network/nftables-warroom-inbound.nft (same boot unit): :8000 (app) only from @app_clients (RFC1918
# by default) and :1883 (MQTT) only from @mqtt_gateways (empty by default). deploy/bin/set_inbound_allow.sh
# narrows/fills them.

name: warroom

x-offline-env: &offline-env
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"

services:
  vllm: &vllm-svc
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.28.0}
    # NVIDIA's own Spark build is the fallback if the upstream arm64 image lacks GB10 (sm_121) kernels:
    #   VLLM_IMAGE=nvcr.io/nvidia/vllm:<yy.mm>-py3
    entrypoint: ["/bin/bash", "/opt/warroom/vllm-serve.sh"]
    environment: &vllm-env
      <<: *offline-env
      QUANT: ${QUANT:-nvfp4}
      SPEC: ${SPEC:-dspark}
      PREFIX_CACHE: ${PREFIX_CACHE:-1}
      KV_DTYPE: ${KV_DTYPE:-fp8}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-32768}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-4}
      GPU_MEM_UTIL: ${GPU_MEM_UTIL:-0.23}   # ~29.4 GB; budget math in vllm-serve.sh
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./vllm-serve.sh:/opt/warroom/vllm-serve.sh:ro
      - ${HF_CACHE:-/opt/warroom/hf}:/root/.cache/huggingface
    ipc: host
    ulimits: { memlock: -1, stack: 67108864 }
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    # VLLM_BIND: 127.0.0.1 by default. The OpenShell-sandboxed app (deploy/openshell/run_sandboxed.sh) runs in
    # its own network namespace where 127.0.0.1 is the sandbox itself, so that path binds this to the Spark's
    # LAN IP and loads deploy/openshell/nft-sandbox-services.nft to keep everyone but the sandbox off it.
    ports: ["${VLLM_BIND:-127.0.0.1}:8001:8000"]
    networks: [core, edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 600s          # first boot loads ~23 GB of weights (21.6 NVFP4 + 1.3 draft) + CUDA graph capture

  vllm-fp8:                       # page-10 control group: FP8, no prefix cache, no speculative decoding
    # YAML merge (<<), not `extends`: `extends` MERGES port lists, so the control group would also publish the
    # parent's :8001 and either clash with production or answer on the production port that the watchdog,
    # preload and bench defaults use. With a YAML merge the `ports` key below replaces the parent's list.
    <<: *vllm-svc
    profiles: [control]
    environment:
      <<: *vllm-env
      QUANT: fp8
      SPEC: "off"
      PREFIX_CACHE: "0"
      KV_DTYPE: auto
      GPU_MEM_UTIL: ${GPU_MEM_UTIL_FP8:-0.45}
    ports: ["127.0.0.1:8002:8000"]

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.4}
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__HTTP_PORT: "6333"
    volumes:
      - ${QDRANT_DATA:-/opt/warroom/data/qdrant}:/qdrant/storage
    mem_limit: 3g                 # page 9: Qdrant 3 GB
    ports: ["${QDRANT_BIND:-127.0.0.1}:6333:6333"]   # sandbox path: Spark LAN IP + nft-sandbox-services.nft
    networks: [core, edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  mqtt-init:                      # writes the broker password file (users warroom-app, gateway) before mqtt starts
    image: ${MQTT_IMAGE:-eclipse-mosquitto:2}
    entrypoint: ["/bin/sh", "/mosquitto/init-auth.sh"]
    user: "0"
    environment:
      MQTT_APP_PASSWORD: ${MQTT_APP_PASSWORD:-}           # empty = random, kept in ${MQTT_DATA}/app.pass
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:-}   # empty = no gateway user (simulator-only demo)
    volumes:
      - ./mosquitto/init-auth.sh:/mosquitto/init-auth.sh:ro
      - ./mosquitto/acl:/mosquitto/acl.src:ro
      - ${MQTT_DATA:-/opt/warroom/data/mqtt}:/mosquitto/auth
    network_mode: none
    restart: "no"

  mqtt:                           # page 10: Modbus/OPC UA gateway -> MQTT -> app (validation + time-series DB)
    image: ${MQTT_IMAGE:-eclipse-mosquitto:2}
    # Authenticated broker: no anonymous clients; deploy/spark/mosquitto/acl lets `gateway` only publish to
    # warroom/telemetry/# and `warroom-app` read it. MQTT_BIND=<Spark LAN IP> lets a real gateway reach it;
    # deploy/network/nftables-warroom-inbound.nft then accepts :1883 only from the IPs in @mqtt_gateways
    # (empty by default = nobody on the LAN; fill it with deploy/bin/set_inbound_allow.sh).
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MQTT_DATA:-/opt/warroom/data/mqtt}:/mosquitto/auth:ro
    ports: ["${MQTT_BIND:-127.0.0.1}:1883:1883"]
    networks: [core, edge]
    depends_on:
      mqtt-init: { condition: service_completed_successfully }
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-warroom-app:latest}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      <<: *offline-env
      LLM_MODE: ${LLM_MODE:-llm}
      BASE_URL: http://${VLLM_BIND:-127.0.0.1}:8001/v1    # host network: the ports vllm/qdrant/mqtt publish
      MODEL: nemotron
      LLM_FALLBACK_TO_MOCK: "true"       # model down -> deterministic commander, logged in audit
      QDRANT_URL: http://${QDRANT_BIND:-127.0.0.1}:6333
      AUDIT_PATH: /app/data/runtime/audit.jsonl
      SCHEDULE_DIR: /app/data/runtime/schedules
      SCENARIO: ${SCENARIO:-day_loop}
      SIM_SPEED: ${SIM_SPEED:-1.0}
      HOST: 0.0.0.0                       # all host interfaces: 127.0.0.1 for the touchscreen, LAN for the phone
      PORT: "8000"
      WARROOM_INGEST: ${WARROOM_INGEST:-mqtt}            # readings go sim/gateway -> mosquitto -> app; broker down = direct + counted
      WARROOM_MQTT_URL: mqtt://${MQTT_BIND:-127.0.0.1}:1883
      WARROOM_MQTT_USERNAME: warroom-app
      WARROOM_MQTT_PASSWORD_FILE: /app/mqtt-auth/app.pass   # written by mqtt-init, readable by uid 10001 only
      # REQUIRED: the supervisor phone sends it as X-Supervisor-Pin over the LAN. compose refuses to start without it.
      WARROOM_SUPERVISOR_PIN: ${WARROOM_SUPERVISOR_PIN:?set WARROOM_SUPERVISOR_PIN (8+ random chars) in deploy/spark/.env}
      WARROOM_DEMO_CONTROLS: ${WARROOM_DEMO_CONTROLS:-1}  # 0 on a real line: /api/sim/* refused
      WARROOM_LOOPBACK_LOCAL: "1"   # host network: 127.0.0.1 really is the on-box touchscreen (the app turns loopback off by default inside a NAT'd container)
    volumes:
      - ${APP_DATA:-/opt/warroom/data/runtime}:/app/data/runtime
      - ${MQTT_DATA:-/opt/warroom/data/mqtt}:/app/mqtt-auth:ro
    mem_limit: 6g                 # page 9: scheduling + app 6 GB
    network_mode: host            # real client addresses; see the header. No `ports:` / `networks:` here.
    depends_on:
      qdrant: { condition: service_healthy }
      vllm: { condition: service_started }      # app starts in mock fallback while the model loads
      mqtt-init: { condition: service_completed_successfully }
      mqtt: { condition: service_started }
    restart: unless-stopped

networks:
  core:
    internal: true
  edge:
    driver: bridge
