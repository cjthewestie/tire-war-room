# Page-10 broker (Modbus/OPC UA gateway -> MQTT -> app). Authenticated: no anonymous clients, every user
# limited by the ACL. The password file is written at stack start by init-auth.sh (compose service
# mqtt-init) into ${MQTT_DATA}, mounted here at /mosquitto/auth.
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
