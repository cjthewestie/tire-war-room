[project]
name = "warroom"
version = "0.1.0"
description = "Team Westie - solid-tire smart-manufacturing war room (edge agentic AI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "ortools>=9.10",
    "qdrant-client[fastembed]>=1.10",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "httpx>=0.27",
    "openai>=1.40",
    "pypdf>=4.2",
    "paho-mqtt>=2.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "psutil>=5.9",
    "orjson>=3.10",
]

# NeMo Agent Toolkit plugin (pages 5, 9, 10, 12): registers the event workflow (tool and commander calls traced) with
# NAT so `nat run` / `nat eval` (profiler) drive the real state machine. NAT itself is NOT a project
# dependency: nvidia-nat-profiler pins pandas<3 and rich<15, which would downgrade the whole demo. It runs
# as an overlay instead (deploy/nat/requirements.txt, deploy/nat/run.sh):
#   uv run --with-requirements deploy/nat/requirements.txt nat eval --config_file deploy/nat/eval.yml
[project.entry-points."nat.components"]
warroom = "warroom.natkit.register"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120

[tool.ruff]
line-length = 110
target-version = "py312"
