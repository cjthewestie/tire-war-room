# Safety and sensitive terms Agent Nemo's chat blocks in code, before and after the model.
# CJ, 2026-10-21: 「一些安全跟敏感詞彙還是要用程式擋下來」 (a deliberate exception to 「不要程式先看」).
#
# Edit freely; the server reloads this file when it changes (warroom/agent/safety_filter.py).
# Each category: reply (the fixed polite line), where (input / output / both) and terms. A term is plain text,
# or a regex when it starts with "re:". Plain terms match case-insensitively; an ASCII word also needs word
# boundaries ("pin" never matches "spinning"). `allow` lists phrases that are never blocked (plant questions that
# contain a blocked word, e.g. 「安全核心是什麼」).

allow:
  - 安全核心是什麼
  - 安全規範
  - SOP
  - 停機
  - 爆炸風險
  - 殺菌

# QA 模式 only (POST /api/qa/ask, warroom/agent/qa.py), INPUT side only: these words may appear in a judge's question
# about the framework (「可以跑 bash 嗎」「HMAC 金鑰怎麼管」). CJ, 2026-10-22: 「QA 放行」. Agent Nemo's chat never uses
# this list, and no output check does: secret values, paths, IPs and every category on the output stay blocked.
qa_allow: [bash, shell, token, PIN, HMAC 金鑰, 跳過核准]

categories:
  credentials:
    reply: 密碼、金鑰這類機密我不能提供，也不會在對話裡處理；需要的話請找系統管理員。
    where: both
    terms: [密碼, 帳號密碼, PIN, API key, apikey, token, HMAC 金鑰, HMAC key, 金鑰, .env, 憑證]

  bypass:
    reply: 這個我不能做：系統和控制只能透過計劃送你核准來變更，安全核心、核准和稽核都不能關掉或跳過。
    where: both
    terms:
      - bash
      - shell
      - sudo
      - rm -rf
      - re:PLC\s*寫入
      - re:(?:關掉|關閉|停用|取消)\s*安全(?:核心)?
      - re:跳過\s*核准
      - bypass
      - re:(?:關閉|刪除|清除|修改)\s*稽核

  personal_data:
    reply: 同仁的個人資料（身分證、薪資、電話、住址）我不能查，也不會提供。
    where: both
    terms:
      # only about a person: 「S13 的電話」「王小明薪水多少」, not 「維修廠商電話」
      - re:(?:S\d{1,3}\s*的?|他的?|她的?|員工的?|作業員的?|組長的?|同仁的?|[\u4e00-\u9fff]{2,3}的)\s*(?:身分證|身份證|薪資|薪水|電話|手機|住址|地址)
      - 身分證字號

  self_harm:
    reply: 這個我不能協助。如果你或身邊的人需要幫助，請撥 1925（安心專線）或 110；工廠的事我隨時可以幫忙。
    where: both
    terms: [自殺, 自殘, 輕生, 不想活]

  weapons_violence:
    reply: 這個我不能協助。工廠的事我隨時可以幫忙。
    where: both
    terms:
      - re:殺(?!菌|蟲|價)
      - re:炸(?:彈|藥|毀|掉)
      - 武器

  harassment:
    reply: 我們好好說，我在這裡幫你處理工廠的事。
    where: both
    # kept short on purpose: common profanity and slurs only; a long list blocks normal speech by accident
    terms: [幹你娘, 操你, 他媽的, 去死, 智障, 白癡, 支那]

# 建議 6 (docs/research/edge-agent-harness-2026-11.md, G12): instructions hidden in UNTRUSTED data the Event Commander
# reads -- SOP chunks, machine memory (後台 notes, past events), PLANT.md. Never used on Agent Nemo's chat (the
# categories above are; this section is not one of them). warroom/agent/commander.py untrusted_flags() scans only those
# segments with it, and each hit (segment id + rule name) goes into the commander's LLM_CALL audit as untrusted_flags.
# It flags, it does not block or re-rate anything: the gate, the approval and the code-bound numbers already decide.
# Every rule is checked against the full SOP corpus (warroom/kb/sop, data/synthetic_sop, the team dataset's
# sop_chunks.jsonl) and the seed PLANT.md, which must give no hit (tests/test_commander_injection.py): normal SOP text
# such as 「安全核心直接停機」「不得直接寫入 PLC」 is not an instruction to the model.
untrusted_categories:
  injection:
    rules:
      ignore_rules:
        - re:(?:忽略|無視|不要理會?|別管|不用管|跳過)\s*(?:以上|上面|前面|先前|之前|所有|全部|你的|系統的?|原本的?)*\s*的?\s*(?:指令|規則|指示|限制|提示)
        - re:\b(?:ignore|disregard|forget)\b.{0,24}\b(?:instructions?|rules?|prompt)\b
      direct_confirm:
        - re:直接\s*(?:confirm|確認(?:新)?排程|核准|批准|送出|套用)
        - re:(?:不用|不需要?|不必|免|無需|不須)\s*(?:經過|等)?\s*(?:主管)?\s*(?:的)?\s*(?:核准|批准|審核)
        - re:自動\s*(?:核准|批准)
      role_override:
        - re:你(?:現在)?(?:是|當|扮演)\s*(?:系統)?(?:管理員|admin|root)
        - re:(?:system|系統)\s*prompt|系統提示詞
        - re:新(?:的)?指令\s*[:：]
        - re:\b(?:you are now|act as)\b
      tool_call:
        - re:(?:呼叫|執行|使用|call|run|invoke)\s*(?:confirm_schedule|set_cure_time|notify_teams|solve_schedule)
      disable_safety:
        - re:(?:關掉|關閉|停用|取消|繞過|跳過)\s*(?:安全核心|安全規則|核准|稽核|gate)

# secret-looking strings in a REPLY (output only): replaced, and audited
output_reply: 這段回覆含有不該顯示的內容（例如金鑰、路徑或位址），已由系統擋下。要查工廠資料請再說一次。
output_patterns:
  - re:\b(?:\d{1,3}\.){3}\d{1,3}\b                 # an IP address
  - re:(?:~|/Users|/home|/private)/\S+            # a home or system path
  - re:data/runtime\S*                             # the runtime data folder
  - re:\b[0-9a-fA-F]{32,}\b                        # a long hex string (keys, hashes)
